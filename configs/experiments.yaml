# Experiment matrices: the datasets, targets, workflows and models each experiment covers.

# Workflow comparison: datasets x targets x workflows.
workflow_comparison:
  datasets: [seattle, seoul]
  targets: [temp_max, temp_min]
  workflows:
    - TCN
    - TCN + CTGAN
    - TCN + CTGAN (processed)

# Baseline comparison: 7 models x datasets x targets. No CTGAN, no processed workflow.
baseline_comparison:
  datasets: [seattle, seoul]
  targets: [temp_max, temp_min]
  models: [arima, svr, random_forest, lightgbm, lstm, gru, tcn]

# Multivariate input comparison (Seattle only). Feature lists are resolved by the runner from
# datasets.yaml (univariate = [target]; multivariate = multivariate_features;
# multivariate_with_weather = multivariate_features + label-encoded weather).
multivariate_comparison:
  dataset: seattle
  targets: [temp_max, temp_min]
  settings:
    - name: univariate
      use_weather: false
    - name: multivariate
      use_weather: false
    - name: multivariate_with_weather
      use_weather: true

# Overrides applied by --smoke for fast error-checking (not real training).
smoke:
  n_splits: 1
  epochs: 1
  ctgan_epochs: 2
  ctgan_num_samples: 50
  multivariate_series_limit: 150
